<!doctype html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>My personal page</title>
		<style>
			body {
				max-width: 900px;
				margin: 0 auto;
				padding: 40px;
			}
			.about-me {
				display: flex;
				align-items: flex-start;
				gap: 24px;
			}
			.about-me img {
				flex-shrink: 0;
				max-width: 100%;
				height: auto;
			}
			.about-me .about-text {
				flex: 1;
			}
			.videos {
				display: flex;
				flex-wrap: wrap;
				gap: 24px;
			}
			.video-item {
				flex: 1;
				min-width: 280px;
			}
			.video-item video {
				width: 100%;
				height: auto;
				border-radius: 6px;
			}
			.video-item figcaption {
				margin-top: 8px;
				text-align: center;
				color: #555;
			}
			@media (max-width: 600px) {
				body {
					padding: 20px;
				}
				.about-me {
					flex-direction: column;
					align-items: center;
				}
				.about-me img {
					align-self: center;
				}
			}
		</style>
	</head>
	<body>
		<center><h1>Conservative Cell Splitting for Compressible Moving-Mesh Fluid Simulation (On-going)</h1></center>

		<div class="videos">
			<figure class="video-item">
				<video controls loop muted playsinline>
					<source src="videos/gresho_slow.mp4" type="video/mp4">
					Your browser does not support the video tag.
				</video>
				<figcaption>Gresho vortex</figcaption>
			</figure>
			<figure class="video-item">
				<video controls loop muted playsinline>
					<source src="videos/linear_tube_slow.mp4" type="video/mp4">
					Your browser does not support the video tag.
				</video>
				<figcaption>Linear tube</figcaption>
			</figure>
		</div>
	</body>
</html>
